[project]
name = "spark_and_non_spark_etl"
version = "0.1.0"
authors = [{ name = "Christian Corsetti", email = "c.corsetti@reply.it" }]
description = "POC comparing Spark-based and non-Spark-based ETL on different data sizes."
requires-python = ">=3.10"
dependencies = [
    "polars",
    "pyarrow",
    "pyiceberg",
    "duckdb",
    "pyspark", # Include all main dependencies here
    "faker",
]

[project.optional-dependencies]
# Dependencies for development (testing, linting, formatting)
dev = [
    "ruff",
    "black",
    "pre-commit",
    "pytest",
    "memory-profiler",
    "mypy",
]

# Configure Ruff (linter and formatter)
[tool.ruff]
line-length = 88
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "YTT", # flake8-2020
    "S", # flake8-bandit
    "B",  # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "T10", # flake8-debugger
    "SIM",  # flake8-simplify
    "I", # isort
    "C90", # mccabe
    "E", # pycodestyle
    "W",  # Warnings
    "F", # Pyflakes
    "PGH", # Pygrep hooks
    "UP", # Pyupgrade
    "RUF",  # Ruff
    "TRY", # Tryceratops
    "PL", # pylint: https://pypi.org/project/pylint/
    "RET", # flake8-return: https://pypi.org/project/flake8-return/

]
external = [
  "DOC", # pydoclint: https://pypi.org/project/pydoclint/
]
ignore = [
    "E501", # LineTooLong
    "E731", # DoNotAssignLambda
    "F403", # Unspecified Import Names
    "TRY003", # long messages
    "TRY400", # Use logging.exception instead of logging.error
    "S608",  # Possible SQL injection vector through string-based query construction
    "B905", # Zip without explicit strict
    "PLR2004", # Magic values in comparisons (acceptable for domain logic)
    "PLR0912", # Too many branches (complex ETL logic)
    "PLR0913", # Too many arguments (config objects)
    "PLR0915", # Too many statements (ETL pipelines)
    "C901",    # Too complex (ETL functions)
    "S104",    # Binding to all interfaces (0.0.0.0 is default value)
    "PLC0415", # Import not at top (lazy imports for performance)
    "A002",    # Shadowing builtin (format parameter is common)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert (expected in tests)
    "PLR2004", # Magic values in comparisons (common in tests)
    "F841",    # Unused variables (test fixtures)
    "RET504",  # Unnecessary assignment before return (test data setup)
    "SIM117",  # Nested with statements (pytest patterns)
]
"scripts/benchmark.py" = [
    "S603",    # subprocess call (docker commands are trusted)
    "S607",    # Starting process with partial path (docker/docker-compose)
]

[tool.ruff.lint.pydocstyle]
convention = "google"


# [tool.ruff.format]
# quote-style = "double"
# indent-style = "space"
# skip-magic-trailing-comma = false
# line-ending = "auto"

# Configure Black (formatter)
[tool.black]
line-length = 88
target-version = ["py312"]

