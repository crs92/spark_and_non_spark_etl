---
# ServiceAccount for Spark workloads
# Note: No IRSA annotations needed with Pod Identity!
# Pod Identity Association is configured in Terraform
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-sa
  namespace: default
  labels:
    app: spark-etl
    managed-by: terraform

---
# ServiceAccount for Polars workloads
# Note: No IRSA annotations needed with Pod Identity!
# Pod Identity Association is configured in Terraform
apiVersion: v1
kind: ServiceAccount
metadata:
  name: polars-sa
  namespace: default
  labels:
    app: polars-etl
    managed-by: terraform
