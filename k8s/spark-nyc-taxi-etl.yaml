---
# SparkApplication for NYC Taxi ETL with Pod Identity
# This manifest uses EKS Pod Identity for S3 access (no IRSA annotations needed)

apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-nyc-taxi-etl
  namespace: default
  labels:
    app: spark-etl
    dataset: nyc-taxi
    version: v1
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster

  # Container image from ECR
  # Replace ACCOUNT_ID and REGION with actual values from: terraform output
  image: "ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/spark-etl:latest"
  imagePullPolicy: Always

  # Main Python application file (included in container image)
  mainApplicationFile: "local:///app/src/etl/spark_etl_nyc_taxi.py"

  # Arguments for NYC Taxi ETL
  arguments:
    - "--data-size"
    - "small"  # Options: tiny, small, medium, large, xlarge
    - "--output-bucket"
    - "etl-benchmark-data-ACCOUNT_ID"  # Replace with actual bucket name

  # Spark version
  sparkVersion: "3.5.0"

  # Spark configuration optimized for NYC Taxi data
  sparkConf:
    # S3A Configuration for Pod Identity
    # Pod Identity automatically provides credentials - no manual configuration needed!
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"
    "spark.hadoop.fs.s3a.fast.upload": "true"
    "spark.hadoop.fs.s3a.block.size": "128M"
    "spark.hadoop.fs.s3a.multipart.size": "128M"
    "spark.hadoop.fs.s3a.connection.maximum": "100"

    # Performance tuning for Parquet files
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.sql.adaptive.skewJoin.enabled": "true"
    "spark.sql.files.maxPartitionBytes": "134217728"  # 128MB
    "spark.sql.shuffle.partitions": "200"
    "spark.default.parallelism": "100"

    # Memory management
    "spark.memory.fraction": "0.8"
    "spark.memory.storageFraction": "0.3"
    "spark.executor.memoryOverhead": "1024"

    # Serialization
    "spark.serializer": "org.apache.spark.serializer.KryoSerializer"
    "spark.kryoserializer.buffer.max": "512m"

    # Parquet optimization
    "spark.sql.parquet.compression.codec": "snappy"
    "spark.sql.parquet.mergeSchema": "false"
    "spark.sql.parquet.filterPushdown": "true"

  # Hadoop configuration
  hadoopConf:
    "fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "fs.s3a.aws.credentials.provider": "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"

  # Driver configuration
  driver:
    cores: 2
    coreLimit: "2000m"
    memory: "4g"

    # ServiceAccount with Pod Identity (no annotations needed!)
    serviceAccount: spark-sa

    labels:
      version: "3.5.0"
      app: spark-nyc-taxi-driver
      workload: etl

    env:
      - name: AWS_REGION
        value: "us-east-1"
      - name: PYTHONPATH
        value: "/app"
      - name: BENCHMARK_NAME
        value: "nyc-taxi-etl"

  # Executor configuration (scaled based on data size)
  executor:
    cores: 4
    coreLimit: "4000m"
    memory: "8g"
    instances: 3  # Adjust based on data size: tiny=2, small=3, medium=5, large=10

    labels:
      version: "3.5.0"
      app: spark-nyc-taxi-executor
      workload: etl

    env:
      - name: AWS_REGION
        value: "us-east-1"
      - name: PYTHONPATH
        value: "/app"

  # Dynamic allocation for auto-scaling
  dynamicAllocation:
    enabled: true
    initialExecutors: 2
    minExecutors: 2
    maxExecutors: 10
    shuffleTrackingTimeout: 60s

  # Restart policy
  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 20

  # Monitoring
  monitoring:
    exposeDriverMetrics: true
    exposeExecutorMetrics: true
    prometheus:
      jmxExporterJar: "/prometheus/jmx_prometheus_javaagent-0.17.0.jar"
      port: 8090

  # Cleanup after 1 hour
  timeToLiveSeconds: 3600

---
# ConfigMap with data size configurations
apiVersion: v1
kind: ConfigMap
metadata:
  name: nyc-taxi-config
  namespace: default
data:
  data-sizes.yaml: |
    # NYC Taxi dataset configurations
    tiny:
      description: "1 month of data"
      date_range: "2022-01"
      approx_size_gb: 0.1
      approx_records: 3000000
      executors: 2

    small:
      description: "1 year of data"
      date_range: "2022-01 to 2022-12"
      approx_size_gb: 1.2
      approx_records: 40000000
      executors: 3

    medium:
      description: "3 years of data"
      date_range: "2020-01 to 2022-12"
      approx_size_gb: 4.0
      approx_records: 120000000
      executors: 5

    large:
      description: "5 years of data"
      date_range: "2018-01 to 2022-12"
      approx_size_gb: 10.0
      approx_records: 200000000
      executors: 10

    xlarge:
      description: "8 years of data"
      date_range: "2015-01 to 2022-12"
      approx_size_gb: 50.0
      approx_records: 500000000
      executors: 20
