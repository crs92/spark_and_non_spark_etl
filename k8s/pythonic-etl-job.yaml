apiVersion: batch/v1
kind: Job
metadata:
  name: pythonic-etl-job
  labels:
    app: pythonic-etl
    stack: pythonic
spec:
  template:
    metadata:
      labels:
        app: pythonic-etl
        stack: pythonic
    spec:
      restartPolicy: Never
      containers:
      - name: pythonic-etl
        image: localhost/pythonic-etl:latest
        imagePullPolicy: Never
        env:
        - name: PYTHONPATH
          value: "/app"
        - name: MINIO_ENDPOINT
          value: "http://minio:9000"
        - name: MINIO_ACCESS_KEY
          value: "minioadmin"
        - name: MINIO_SECRET_KEY
          value: "minioadmin123"
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "iceberg_catalog"
        - name: POSTGRES_USER
          value: "iceberg"
        - name: POSTGRES_PASSWORD
          value: "iceberg123"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: etl-data-pvc
  backoffLimit: 3
