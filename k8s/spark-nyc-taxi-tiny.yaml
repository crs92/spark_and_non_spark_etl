---
# SparkApplication for NYC Taxi ETL - TINY Dataset (1 month)
# Dataset: 2022-01 (~100MB, 3M records)
# Configuration: 2 executors, 4 cores, 8GB each
# Use case: Testing and validation

apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-nyc-taxi-tiny
  namespace: default
  labels:
    app: spark-etl
    dataset: nyc-taxi
    data-size: tiny
    benchmark: vertical-vs-horizontal
    cost-tracking: enabled
    version: v1
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster

  # Container image from ECR (working Pod Identity configuration)
  image: "764738119924.dkr.ecr.eu-central-1.amazonaws.com/spark-etl:minimal"
  imagePullPolicy: Always

  # Main Python application file (included in container image)
  mainApplicationFile: "local:///opt/spark/work-dir/spark_etl_nyc_taxi_k8s.py"

  # Arguments for NYC Taxi ETL - TINY dataset
  arguments:
    - "--size"
    - "tiny"
    - "--output"
    - "/tmp/output"
    - "--s3-bucket"
    - "s3://etl-benchmark-data-764738119924"

  # Spark version
  sparkVersion: "3.5.0"

  # Spark configuration optimized for TINY dataset with Pod Identity
  sparkConf:
    # S3A Configuration for Pod Identity
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.DefaultAWSCredentialsProviderChain"
    "spark.hadoop.fs.s3a.endpoint.region": "eu-central-1"
    "spark.driver.extraClassPath": "/opt/spark/jars/hadoop-aws-3.3.4.jar:/opt/spark/jars/aws-java-sdk-bundle-1.12.770.jar"
    "spark.executor.extraClassPath": "/opt/spark/jars/hadoop-aws-3.3.4.jar:/opt/spark/jars/aws-java-sdk-bundle-1.12.770.jar"
    "spark.hadoop.fs.s3a.fast.upload": "true"
    "spark.hadoop.fs.s3a.block.size": "128M"
    "spark.hadoop.fs.s3a.multipart.size": "128M"
    "spark.hadoop.fs.s3a.connection.maximum": "50"

    # Performance tuning for small dataset
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.sql.files.maxPartitionBytes": "134217728"  # 128MB
    "spark.sql.shuffle.partitions": "20"  # Reduced for tiny dataset
    "spark.default.parallelism": "8"

    # Memory management
    "spark.memory.fraction": "0.8"
    "spark.memory.storageFraction": "0.3"
    "spark.executor.memoryOverhead": "1024"

    # Serialization
    "spark.serializer": "org.apache.spark.serializer.KryoSerializer"

    # Parquet optimization
    "spark.sql.parquet.compression.codec": "snappy"
    "spark.sql.parquet.filterPushdown": "true"

  # Hadoop configuration
  hadoopConf:
    "fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "fs.s3a.aws.credentials.provider": "com.amazonaws.auth.DefaultAWSCredentialsProviderChain"

  # Driver configuration
  driver:
    cores: 1
    coreLimit: "1000m"
    memory: "2g"

    # ServiceAccount with Pod Identity (no annotations needed!)
    serviceAccount: spark-sa

    labels:
      version: "3.5.0"
      app: spark-nyc-taxi-driver
      workload: etl
      data-size: tiny
      cost-center: benchmark

    env:
      - name: AWS_REGION
        value: "eu-central-1"
      - name: PYTHONPATH
        value: "/app"
      - name: BENCHMARK_NAME
        value: "nyc-taxi-etl-tiny"
      - name: DATA_SIZE
        value: "tiny"

  # Executor configuration - 2 executors for tiny dataset
  executor:
    cores: 1
    coreLimit: "1000m"
    memory: "2g"
    instances: 2  # Fixed for tiny dataset

    labels:
      version: "3.5.0"
      app: spark-nyc-taxi-executor
      workload: etl
      data-size: tiny
      cost-center: benchmark

    env:
      - name: AWS_REGION
        value: "eu-central-1"
      - name: PYTHONPATH
        value: "/app"

  # Dynamic allocation disabled for consistent benchmarking
  dynamicAllocation:
    enabled: false

  # Restart policy
  restartPolicy:
    type: Never

  # Cleanup after 1 hour
  timeToLiveSeconds: 3600
